apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-role-binding
  namespace: jenkins
subjects:
- kind: ServiceAccount
  name: ecr-service-account
  namespace: jenkins
roleRef:
  kind: ClusterRole
  name: eksctl:pod-ecr-auth:default:ECRReadOnlyPolicy
  apiGroup: rbac.authorization.k8s.io
