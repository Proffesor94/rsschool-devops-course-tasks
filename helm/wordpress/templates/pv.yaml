apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.wordpress.storage.pv.name }}
  labels:
    type: local
spec:
  storageClassName: {{ .Values.wordpress.storage.pv.storageClassName }}
  claimRef:
    name: {{ .Values.wordpress.storage.pvc.name }}
    namespace: {{ .Values.namespace }}
  capacity:
    storage: {{ .Values.wordpress.storage.size }}
  accessModes:
    - {{ .Values.wordpress.storage.accessMode }}
  hostPath:
    path: {{ .Values.wordpress.storage.pv.hostPath }}