wordpress:
  image: "bitnami/wordpress:latest"
  serviceAccountName: wordpress-admin
  replicas: 1
  storage:
    accessMode: ReadWriteOnce
    size: 10Gi
    pv:
      name: wordpress-pv
      storageClassName: local-storage
      hostPath: "/mnt/data/wordpress"
    pvc:
      name: wordpress-pv-claim
  resources:
    limits:
      memory: "1Gi"
      cpu: "500m"
    requests:
      memory: "512Mi"
      cpu: "250m"
  service:
    type: NodePort
    nodePort: 32000
    port: 80
  env:
    - name: ALLOW_EMPTY_PASSWORD
      value: "yes"

mariadb:
  enabled: true
  image: "bitnami/mariadb:latest"
  mariadbRootPassword: "mariadbpassword"
  mariadbDatabase: "wordpress_db"
  mariadbUser: "wpuser"
  mariadbPassword: "wppassword"
  storage:
    accessMode: ReadWriteOnce
    size: 5Gi
    pv:
      name: mariadb-pv
      storageClassName: local-storage
      hostPath: "/mnt/data/mariadb"
    pvc:
      name: mariadb-pv-claim

storageClass:
  enabled: true
  name: local-storage
  provisioner: kubernetes.io/no-provisioner
  volumeBindingMode: WaitForFirstConsumer